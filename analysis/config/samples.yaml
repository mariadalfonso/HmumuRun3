    EWKZ: 1710                         # TEMP: placeholder for now from Andrea
    W: 67710000
    EWKW: 91480
    TT2l2n: 96978                      # needed the 2L BR (NNLO)
    TTln: 404536.8
    TW2l2n: 4614.75
    WWto2L2Nu: 11790                   # NLO
