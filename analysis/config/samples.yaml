# =====================================================================
#  Sample registry for the H->mumu Run 3 analysis.
#
#  Pure data: nothing here touches the filesystem. datasets.BuildDict
#  reads this file and returns path patterns; the glob happens in
#  utilsAna.SwitchSample when a sample is actually selected.
#
#  Path placeholders: {ceph} {scratch} {year} {campaign}
#
#  ALL CROSS-SECTIONS ARE IN fb, matching lumis[] in fb^-1. An xsec is:
#     xsec: 2219000                             a plain value
#     xsec: {ref: W}                            named process, xsecs.run3
#     xsec: {ref: VBFH, br: H_to_mumu}          times a branching ratio
#     xsec: {ref: Wm, br: [H_to_WW, W_to_qq]}   times several
#     xsec: {value: 21650, factor: 0.6}         times an empirical scaling
#  'br' takes physics constants from branching_ratios below; 'factor' is
#  for everything else, so empirical fudges stay visible as fudges.
# =====================================================================

periods:
  "12022":
    campaign: "130X_mcRun3_2022_realistic_v*/*"
    ceph:     "/ceph/submit/data/group/cms/store/Hmumu/v12"
    scratch:  "/scratch/submit/cms/mariadlf/Hmumu/v12"
  "22022":
    campaign: "130X_mcRun3_2022_realistic_postEE_v*/*"
    ceph:     "/ceph/submit/data/group/cms/store/Hmumu/v12"
    scratch:  "/scratch/submit/cms/mariadlf/Hmumu/v12"
  "12023":
    campaign: "130X_mcRun3_2023_realistic_v*/*"
    ceph:     "/ceph/submit/data/group/cms/store/Hmumu/v12"
    scratch:  "/scratch/submit/cms/mariadlf/Hmumu/v12"
  "22023":
    campaign: "130X_mcRun3_2023_realistic_postBPix_v*-v*/*"
    ceph:     "/ceph/submit/data/group/cms/store/Hmumu/v12"
    scratch:  "/scratch/submit/cms/mariadlf/Hmumu/v12"
  "2024":
    campaign: "150X_mcRun3_2024_realistic_v*-v*/*"
    ceph:     "/ceph/submit/data/group/cms/store/Hmumu/v15"
    scratch:  "/scratch/submit/cms/mariadlf/Hmumu/v15"
  "2025":
    campaign: "150X_mcRun3_2025*-v*/*"
    ceph:     "/ceph/submit/data/group/cms/store/Hmumu/v15"
    scratch:  "/scratch/submit/cms/mariadlf/Hmumu/v15"
  "2026":
    campaign: "150X_mcRun3_2025*-v*/*"
    ceph:     "/ceph/submit/data/group/cms/store/Hmumu/v15"
    scratch:  "/scratch/submit/cms/mariadlf/Hmumu/v15"

# ---------------------------------------------------------------------
# --- KB: check the following xsec ---
#
#  * tt_to_lnu2q (branching_ratios, used by sample 239): 0.444 here, but
#    xsecs.run3.TTln folds in 0.438 for the same decay, and PDG is ~0.438.
#    Samples 239 and 107 currently disagree.
#
#  * HtoZGto2L (samples 20-26): xsec is sigma(H) x BR(H->Zgamma) only, with
#    no BR(Z->ll) ~ 0.067, although the datasets are Z->2L. If the decay was
#    forced at generation the normalisation is high by ~15x. The fix would be
#    br: [H_to_Zgamma, Z_to_ll].
#
#  * sample 117 (DY PTLL-600): value is 0.08555 x 100, where its siblings
#    114-116 all use x1000. Possible factor-of-10 error.
#
#  * samples 112 vs 120 (DY 1-jet): 1017000 and 1017500 fb for what the
#    comments describe as the same cross-section.
#
#  * sample 109: comment says "*0.05 reduction empirical" but the applied
#    factor is 0.95, i.e. a 5% reduction. Wording only, if intended.
# ---------------------------------------------------------------------
#
# --- KB: check the following path ---
#
#  * samples 242-245: the mg35x_ campaign prefix is applied in every period,
#    unlike sample 221 which restricts it to 2024. Carried over from the
#    legacy pathEx(..., year_=year), whose "year in year_" test was always
#    true. Preserved as-is; if unintended, move it to
#    campaign_prefix: {value: "mg35x_", years: ["2024"]}.
# ---------------------------------------------------------------------

# ---------------------------------------------------------------------
#  Branching ratios and decay fractions, factored out of the sample
#  cross-sections so they can be checked and updated in one place.
# ---------------------------------------------------------------------
branching_ratios:
  H_to_mumu: 0.00022                       # BR(H->mumu)
  H_to_Zgamma: 0.0015                      # BR(H->Z gamma)
  H_to_WW: 0.2137                          # BR(H->WW)
  W_to_lnu: 0.325                          # BR(W->l nu), summed over 3 flavours
  W_to_qq: 0.675                           # BR(W->qq) = 1 - BR(W->l nu)
  Z_to_ll: 0.1                             # BR(Z->ll), summed over 3 flavours
  Z_to_qq: 0.7                             # BR(Z->qq)
  tt_to_2l2nu: 0.105                       # BR(ttbar->2l 2nu)
  tt_to_lnu2q: 0.444                       # BR(ttbar->l nu 2q); note xsecs.run3.TTln uses 0.438  KB: check
  one_lepton_flavour: 0.3333333333333333   # flavour fraction, not a BR: one of ee/mumu/tautau

# ---------------------------------------------------------------------
#  Named cross-sections in fb, grouped by run so the beam energy is
#  explicit. Sources: xsecdb-xsdb-official.app.cern.ch,
#  arxiv 2402.09955 (Higgs), LHCTopWG (top).
# ---------------------------------------------------------------------
