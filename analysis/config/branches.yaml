    - goodWjj_pt
    - goodWjj_eta
    - goodWjj_phi
    - dEtaWjjH
    - dPhiWjjH
    - RPt

  isTTlep:
    - Muon1_promptMVA
    - Muon2_promptMVA
    - Lepton_promptMVA
    - Lepton2_promptMVA
    - Lepton_Pt
    - Lepton2_Pt
    - Lepton_Eta
    - Lepton2_Eta
