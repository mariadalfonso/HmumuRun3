# =====================================================================
#  Output branches written to the snapshot, per analysis category.
#
#  Read by tools.branches.branch_list(mode, is_mc), which returns
#      base + per_mode[mode]
#      + base_mc_only + per_mode_mc_only[mode]   when MC
#
#  Every name here must be a column defined in Hmm.py by the time
#  Snapshot runs. A name that is not defined is reported at startup
#  rather than failing mid-job.
# =====================================================================

# ---------------------------------------------------------------------
#  Written for every category, MC and data alike.
# ---------------------------------------------------------------------
base:
  - mc
  - w
  - w_allSF
  - lumiIntegrated
  - PV_npvsGood
  # number of muons passing the full per-muon selection: the multiplicity
  # getMuonIndices branches on, since it receives goodMuons-masked arrays
  - nGoodMuons
  - run
  - event
  - luminosityBlock
  - boson_ptWeight
  - HiggsCandCorrMass
  - HiggsCandCorrPt
  - HiggsCandCorrRapidity
  - HiggsCandMassErr
  - cosThetaCS
  - phiStarCS
  - classify
  - isZ
  - isH
  - isHSB
  - isZandHSB
  - Muon1_pt
  - Muon2_pt
  - Muon1_eta
  - Muon2_eta
  - PuppiMET_pt
  - PuppiMET_phi
  - discrMVA

# ---------------------------------------------------------------------
#  Written for every category, MC only. These are defined in the common
#  "if mc>0" block of doCategories, so they exist for all seven modes.
# ---------------------------------------------------------------------
base_mc_only:
  - Muon1_genPartFlav
  - Muon2_genPartFlav
  # gen-level origin of the selected pair: 25 = H, 23 = Z, 24 = W,
  # 15 = tau, 4/5 = heavy flavour, 0 = unmatched
  - Muon1_genOrigin
  - Muon2_genOrigin
  - pairFromHiggs
  # how many of the good muons came from the Higgs. With pairFromHiggs
  # false, nGoodMuFromH == 2 means the right pair was available and the
  # pairing chose wrong (recoverable); < 2 means an H muon was lost
  # by the object selection (not a pairing problem).
  - nGoodMuFromH

# ---------------------------------------------------------------------
#  Category-specific, MC and data alike.
# ---------------------------------------------------------------------
per_mode:

  isVBF:
