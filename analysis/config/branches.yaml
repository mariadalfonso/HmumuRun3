# ---------------------------------------------------------------------
#  Category-specific, MC only (generator-level and matching info).
# ---------------------------------------------------------------------
per_mode_mc_only:

  isVBF:
    - jetVBF1_partonFlavour
    - jetVBF2_partonFlavour
    - jetVBF1_LHE
    - jetVBF2_LHE
    - jetAll_LHE
    - boson_genMassZ
    - boson_genPtZ

  isGGH:
    - boson_genMassZ
    - boson_genPtZ

  isZinv:
    - boson_genMassZ
    - boson_genPtZ

  isVlep:
    - Lepton_genPartFlav
    - boson_genMassZ
    - boson_genPtZ
    # --- pairing study -------------------------------------------------
    # Per-good-muon properties, masked by goodMuons, so index_Mu indexes
    # straight into them. Variable-length arrays of nGoodMuons entries.
    # index_Mu records what the current algorithm chose, which is what any
    # new criterion has to be scored against.
    - index_Mu
    - goodMu_pt
    - goodMu_rawpt
    - goodMu_eta
    - goodMu_phi
    - goodMu_charge
    - goodMu_genOrigin
    - goodMu_genPartFlav
    - goodMu_sip3d
    - goodMu_iso04
    - goodMu_miniIso
    - goodMu_promptMVA
    - goodMu_jetDF
    - goodMu_mt
    - goodMu_dRminB

  isVhad:
    - boson_genMassZ
    - boson_genPtZ

  isTTlep:
    - Lepton_genPartFlav
    # --- pairing study -------------------------------------------------
    # Per-good-muon properties, masked by goodMuons, so index_Mu indexes
    # straight into them. Variable-length arrays of nGoodMuons entries.
    # index_Mu records what the current algorithm chose, which is what any
    # new criterion has to be scored against.
    - index_Mu
    - goodMu_pt
    - goodMu_rawpt
    - goodMu_eta
    - goodMu_phi
    - goodMu_charge
    - goodMu_genOrigin
    - goodMu_genPartFlav
    - goodMu_sip3d
    - goodMu_iso04
    - goodMu_miniIso
    - goodMu_promptMVA
    - goodMu_jetDF
    - goodMu_mt
    - goodMu_dRminB

  isTThad:
    # nothing category-specific; see base_mc_only
