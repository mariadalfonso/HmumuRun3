    - dEtaJJ
    - dPhiJJ
    - ZepVar
    - CenEta
    - minDetaDiMuVBF
    - minDphiDiMuVBF
    - RPt
    - CenPt
    - jetVBF2_hfcentralEtaStripSize
    - jetVBF1_hfcentralEtaStripSize
    - jetVBF2_hfadjacentEtaStripsSize
    - jetVBF1_hfadjacentEtaStripsSize

  isGGH:
