# =====================================================================
#  Output branches written to the snapshot, per analysis category.
#
#  Read by tools.branches.branch_list(mode, is_mc), which returns
#      base + per_mode[mode]
#      + base_mc_only + per_mode_mc_only[mode]   when MC
#
#  Every name here must be a column defined in Hmm.py by the time
#  Snapshot runs. A name that is not defined is reported at startup
#  rather than failing mid-job.
# =====================================================================

# ---------------------------------------------------------------------
#  Written for every category, MC and data alike.
# ---------------------------------------------------------------------
base:
  - mc
  - w
  - w_allSF
  - lumiIntegrated
  - PV_npvsGood
  - nGoodMuons
  - run
  - event
  - luminosityBlock
  - boson_ptWeight
  - HiggsCandCorrMass
  - HiggsCandCorrPt
  - HiggsCandCorrRapidity
  - HiggsCandMassErr
  - cosThetaCS
  - phiStarCS
  - classify
  - isZ
  - isH
  - isHSB
  - isZandHSB
  - Muon1_pt
  - Muon2_pt
  - Muon1_eta
  - Muon2_eta
  # --- muon pT resolution / pull study --------------------------------
  #   Muon*_pt      BS-constrained + scale&smear + recovered FSR photon
  #   Muon*_pt_bs   BS-constrained + scale&smear, no FSR photon
  #   Muon*_ptErr   Muon_bsConstrainedPtErr, the track-fit error
  # pt_bs with ptErr is the combination HiggsCandMassErr is built from.
  - Muon1_pt_bs
  - Muon2_pt_bs
  - Muon1_pt_bsRaw
  - Muon2_pt_bsRaw
  # track-fit error, as NanoAOD gives it: the error on _pt_bsRaw
  - Muon1_ptErr
  - Muon2_ptErr
  # the same RELATIVE error moved onto the corrected pT scale. Exact for
  # data; for MC it carries the random smearing draw, and the smearing
  # itself still needs a quadrature term from MuonScaRe's resolution width.
  - Muon1_ptErrScale
  - Muon2_ptErrScale
  # scale correction AND the MC smearing, added in quadrature:
  #   sigma^2 = (k*sigma_trk)^2 + (sigma_smear*pT_corr)^2
  # -1 without Hmm.py --musmear, and in data where there is no smearing
  - Muon1_ptSmearRel
  - Muon2_ptSmearRel
  - Muon1_ptErrSmear
  - Muon2_ptErrSmear
  # relative error to pair with the FSR-corrected Muon*_pt. The absolute
  # error is unchanged by adding a collinear photon; the relative one is not.
  - Muon1_ptErrRel
  - Muon2_ptErrRel
  # FSR recovery: hasFSR splits the two populations so they can be fitted
  # separately, since the photon's own energy error is not available
  - Muon1_hasFSR
  - Muon2_hasFSR
  - Muon1_fsrPt
  - Muon2_fsrPt
  - Muon1_fsrDR
  - Muon2_fsrDR
  - PuppiMET_pt
  - PuppiMET_phi
  - discrMVA

# ---------------------------------------------------------------------
#  Written for every category, MC only. These are defined in the common
#  "if mc>0" block of doCategories, so they exist for all seven modes.
# ---------------------------------------------------------------------
base_mc_only:
  - Muon1_genPartFlav
  - Muon2_genPartFlav
  - Muon1_genOrigin
  - Muon2_genOrigin
  - pairFromHiggs
  # --- truth pT of the two selected muons ------------------------------
  # Bare gen muon, i.e. the muon after FSR and bremsstrahlung, which is
  # what the tracker measured. Truth partner of Muon*_pt_bs.
  - Muon1_genPt
  - Muon2_genPt
  # dR(reco, gen), -1 when the muon has no gen match
  - Muon1_genDR
  - Muon2_genDR

